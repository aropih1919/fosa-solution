# Configuration unique de la solution Fosa — PARC 2026.
# Toute valeur modifiable vit ici. Les nœuds Python ne doivent jamais coder
# une coordonnée, un seuil, un topic, un modèle ou une durée en dur.
# Les secrets (clés API) ne vont JAMAIS dans ce fichier : variables d'environnement.
#
# Valeurs par défaut = ROBOT RÉEL (inventaire ROS du 02/11, ROS_DOMAIN_ID=0).
# Simulation Gazebo : FOSA_CONFIG_OVERRIDE=config/profils/simulation.yaml
# (fait automatiquement par `FOSA_PROFIL=simulation ./run.sh ...`).

system:
  deployment: robot               # robot | local | remote_pc | simulation
  use_sim_time: false             # le robot n'a pas d'horloge Gazebo
  global_frame: map               # publié par slam_toolbox
  base_frame: base_link           # le robot réel n'a pas de base_footprint
  ros_domain_id: 0
  clock_topic: /clock

navigation:
  # Vide = carte par défaut du paquet de bringup (default_map).
  map_yaml: ""
  default_map: maps/cafe_map.yaml
  static_map: auto                # auto | always | never
  profile: balanced               # profil du laboratoire de navigation
  controller: rpp                 # rpp | dwb | mppi
  localization: odom_imu          # odom_imu | odom_only | amcl
  fallback_profile: safe
  fallback_controller: dwb
  fallback_localization: odom_imu

  time_limit_sec: 600.0
  stop_margin_sec: 1.0
  success_radius: 0.20
  arrival_recheck_radius: 0.35
  retry_pause_sec: 1.0
  nav2_startup_timeout_sec: 180.0
  map_check_timeout_sec: 4.0
  map_check_min_agreement: 0.35

  launch_bringup: true
  bringup_package: caytu_nav_bringup
  bringup_launch: solution_bringup.launch.py

  scan_topic: /scan_filtered      # filtre d'auto-détection des organisateurs
  amcl_pose_topic: /amcl_pose
  cmd_vel_topic: /cmd_vel         # Twist, relu par obstacle_avoidance (organisateurs)
  odom_topic: /botwheel_explorer/odom
  odom_frame: odom
  # Empreinte dans base_frame (x vers l'avant). Valeurs du URDF simulé :
  # À MESURER sur le robot réel avant la course.
  footprint: [[0.22, 0.25], [0.22, -0.25], [-0.31, -0.25], [-0.31, 0.25]]
  footprint_padding: 0.03
  center_offset_x: 0.0            # centre géométrique du robot dans base_frame
  max_linear_speed: 0.30          # m/s, arène de 5 m avec des personnes
  max_angular_speed: 0.80         # rad/s
  laser_self_filter: false        # true seulement en simulation (lidar sous le châssis)
  # Scans utilisés par les costmaps. Les scans caméra des organisateurs sont
  # désactivés tant que leur contenu n'a pas été vérifié sur le robot.
  obstacle_sources:
    - name: lidar
      topic: /scan_filtered
      enabled: true
      obstacle_min_range: 0.12
      obstacle_max_range: 3.5
      raytrace_max_range: 4.0
      global_costmap: true
    - name: camera1
      topic: /camera1/scan
      enabled: false
      obstacle_min_range: 0.2
      obstacle_max_range: 2.5
      raytrace_max_range: 3.0
      global_costmap: true
    - name: camera2
      topic: /camera2/scan
      enabled: false
      obstacle_min_range: 0.2
      obstacle_max_range: 2.5
      raytrace_max_range: 3.0
      global_costmap: true
  global_costmap_clear_service: /global_costmap/clear_entirely_global_costmap
  local_costmap_clear_service: /local_costmap/clear_entirely_local_costmap

  guiding_speed_mps: 0.30
  guiding_wait_sec: 15.0

  # Carte vide de secours (monde différent du café).
  blank_map_resolution: 0.05
  blank_map_margin: 15.0

  # Temporisations de service (secondes réelles).
  clock_wait_sec: 10.0
  cancel_timeout_sec: 2.0
  bringup_stop_timeouts: [10.0, 5.0, 2.0]   # SIGINT, SIGTERM, SIGKILL
  stop_repeat_count: 10
  feedback_log_period_sec: 5.0
  floor_line_distance: 0.0      # 0.0 = calcul automatique par l'IMU

perception:
  top_color_topic: /top_camera_color/image_raw
  top_depth_topic: /top_camera_depth/points
  top_info_topic: /top_camera_color/camera_info
  bottom_color_topic: /bottom_camera_color/image_raw
  bottom_depth_topic: /bottom_camera_depth/points
  entities_topic: /perception/entities
  tags_topic: /perception/tags
  person_events_topic: /perception/person_events

  apriltag:
    family: 36h11
    size_m: 0.165                 # côté du carré noir (règlement : 16,5 cm)
    ids: [1, 4, 7, 9]             # aucun autre tag dans l'arène
    max_distance_m: 4.5
    detector: opencv              # opencv | apriltag_ros
    calibration_samples: 10
    calibration_file: ~/.ros/fosa_tag_calibration.yaml
    # Évite le rejet d'un tag à marge blanche d'un bit posé sur un fond sombre.
    min_marker_distance_rate: 0.01
    max_rate_hz: 10.0             # cadence max de détection par caméra
    detection_image_topic: /perception/tags/image   # image de preuve pour le statut
    detection_image_rate_hz: 2.0
    tf_timeout_sec: 0.1
    # Si l'odométrie arrive après l'image : dernière TF acceptée jusqu'à ce
    # retard (pose marquée moins fiable). Mesuré en simulation : ~0,3 s.
    tf_max_lag_sec: 0.5
    # Les deux RealSense détectent ; la caméra haute est à confirmer sur place.
    cameras:
      - name: camera1
        color_topic: /camera1/camera1/color/image_raw
        info_topic: /camera1/camera1/color/camera_info
      - name: camera2
        color_topic: /camera2/camera2/color/image_raw
        info_topic: /camera2/camera2/color/camera_info

  yolo:
    enabled: true                 # install.sh --models télécharge et exporte le modèle ONNX
    model_path: models/yolo11n.onnx
    confidence: 0.45
    input_size: 640
    person_class_index: 0
    max_fps: 8.0
    device: cpu

  person:
    min_distance_m: 0.8
    max_distance_m: 2.5
    min_confidence: 0.50
    consecutive_frames: 3
    cooldown_sec: 25.0
    dynamic_speed_mps: 0.10
    min_height_m: 0.80
    max_width_m: 1.20
    cluster_tolerance_m: 0.18
    min_cluster_points: 12
    tracker_match_m: 0.45
    bearing_tolerance_rad: 0.25
    front_fov_rad: 1.57
    robot_stop_threshold_mps: 0.03

  # Conversion des nuages de points caméra en LaserScan pour Nav2.
  top_scan:
    cloud_topic: /top_camera_depth/points
    scan_topic: /top_camera_scan
    target_frame: base_footprint_level
    transform_tolerance: 0.5
    min_height: 0.60
    max_height: 1.40
    angle_min: -0.785
    angle_max: 0.785
    angle_increment: 0.0087
    scan_time: 0.067
    range_min: 0.3
    range_max: 3.0
    use_inf: true
    inf_epsilon: 1.0

  bottom_scan:
    cloud_topic: /bottom_camera_depth/points
    scan_topic: /bottom_camera_scan
    target_frame: base_footprint_level
    transform_tolerance: 0.5
    min_height: 0.25
    max_height: 1.40
    angle_min: -0.785
    angle_max: 0.785
    angle_increment: 0.0087
    scan_time: 0.067
    range_min: 0.3
    range_max: 1.2
    use_inf: true
    inf_epsilon: 1.0

audio:
  input_device: default
  output_device: default
  sample_rate: 16000
  vad_threshold: 0.50
  vad_rms_scale: 0.03
  vad_frame_ms: 100
  silence_ms: 700
  piper_executable: piper
  audio_player: aplay

dialogue:
  languages: [fr, en]
  default_input_mode: microphone
  greeting_reply: "Bonjour, comment puis-je vous aider ?"
  greeting_en_reply: "Hello, how can I help you?"
  stt:
    provider: local               # local | api | auto
    local_model: small            # faster-whisper : tiny | base | small
    local_device: cpu
    local_compute_type: int8
    api_model: whisper-1
    api_base: https://api.openai.com/v1
    timeout_sec: 8.0
  tts:
    provider: local               # local | api | auto
    local_voice: models/fr_FR-siwis-medium.onnx
    api_voice: ""
    api_model: tts-1
    api_base: https://api.openai.com/v1
    timeout_sec: 5.0
  llm:
    provider: local               # local | api | auto
    local_model: qwen2.5:3b
    local_base: http://127.0.0.1:11434
    api_model: ""
    api_base: https://api.openai.com/v1
    timeout_sec: 8.0
    max_retries: 2
    temperature: 0.2
  confirmation_required: true
  max_turns_memory: 5
  listening_timeout_sec: 10.0
  unknown_location_reply: "Je ne connais pas ce lieu, l'accueil pourra vous renseigner."
  unknown_information_reply: "Je n'ai pas cette information, l'accueil pourra vous renseigner."
  transcript_topic: /assistant/transcript
  response_topic: /assistant/response
  state_topic: /assistant/state

mission:
  greeting_enabled: true
  emergency_location: infirmerie
  default_wait_sec: 20.0
  emergency_keywords: [mal, blessé, blessure, secours, urgence, tomber, tombé, évanoui, sang]

# --------------------------------------------------------------------------
# Course officielle de la phase réelle (guide des équipes PARC 2026).
course:
  tag_ids: [1, 4, 7, 9]
  # Ordre publié par les organisateurs : nom et type À CONFIRMER.
  # string : "7,1,9,4", "[7, 1, 9, 4]" ou JSON {"order": [...]}.
  order_topic: /parc/tag_order
  order_type: string              # string | int32_multi_array
  start_topic: /fosa/course/depart   # départ par commande (./run.sh depart) ou par la voix
  state_topic: /fosa/course/etat
  map_topic: /map                 # carte publiée par slam_toolbox
  # Statut lu par les juges : À REMPLACER par le paquet officiel (caytu_course/statut.py).
  status:
    start_topic: /fosa/statut/depart
    visit_topic: /fosa/statut/tag
    image_topic: /fosa/statut/image
    finish_topic: /fosa/statut/fin
  time_limit_sec: 600.0
  stop_margin_sec: 5.0
  nav2_ready_timeout_sec: 60.0
  visit_distance_m: 0.50          # règlement : centre du robot à 0,5 m du tag
  approach_distance_m: 0.90       # pré-approche si le tag n'a été vu que de loin
  distance_tolerance_m: 0.04
  lateral_tolerance_m: 0.06
  heading_tolerance_deg: 5.0      # règlement : ±12°
  stable_cycles: 5                # cycles consécutifs dans les tolérances
  hold_sec: 5.0                   # maintien après le signalement (À CONFIRMER)
  min_tag_budget_sec: 45.0
  detection_max_age_sec: 0.6
  search_spin_time_sec: 25.0
  search_grid_step_m: 0.8
  search_clearance_m: 0.45
  search_visited_radius_m: 0.8
  front_guard_m: 0.10
  goal_xy_tolerance_m: 0.08       # arrivée Nav2 avant l'alignement visuel
  goal_yaw_tolerance_deg: 7.0
  alignment:
    linear_gain: 0.6
    angular_gain: 1.2
    max_linear_mps: 0.08
    max_angular_rps: 0.35
    min_linear_mps: 0.03          # À AJUSTER : seuil de démarrage de la base
    min_angular_rps: 0.10
    # Objectif d'arrêt (plus strict que les tolérances d'acceptation ci-dessus).
    precision_distance_m: 0.015
    precision_heading_deg: 2.0
    timeout_sec: 20.0
    max_renavigations: 2
  # Vide = cartographie en direct. Sinon : posegraph slam_toolbox sérialisé
  # pendant les essais (seulement si les cartes pré-construites sont autorisées).
  slam_map_file: ""
  # Vide = aucune pose de tag mémorisée (à n'utiliser que si c'est autorisé).
  memorized_tags_file: ""
  tags_output_file: ~/.ros/fosa_tags_course.yaml

# Démarrage vocal hors ligne (bonus de 5 points) : Vosk, grammaire restreinte.
start_word:
  enabled: true
  audio_topic: /speech_audio      # respeaker_node : une phrase par message
  mode: utterance                 # utterance | stream (ex. /audio)
  sample_rate: 16000              # À CONFIRMER (format non documenté)
  channels: 1
  channel_index: 0
  sample_width: 2
  words: [allez]
  # false : vocabulaire libre puis énoncé exact « allez ». Mesuré hors ligne :
  # une grammaire restreinte confond « alors », « allô », « Alex » avec « allez ».
  restricted_grammar: false
  model_path: models/vosk-model-small-fr-0.22   # relatif à caytu_config/config
  min_confidence: 0.75            # « allez » reconnu à 0,88 (voix de synthèse) : À AJUSTER
