# Carte sémantique : noms, alias et ancrages AprilTag.
# Les coordonnées d'approche sont optionnelles : si `approach_pose` est absent,
# la pose est calculée à partir du tag détecté (phase 2, perception).
# Remplacer les tag_ids par ceux réellement posés sur le site.

world: cafe
frame: map
locations_topic: /semantic_map/locations
resolve_service: /semantic_map/resolve_location
by_tag_service: /semantic_map/get_location_by_tag

