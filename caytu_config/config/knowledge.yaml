faq:
  - question: "Où sont les toilettes ?"
    answer: "Les toilettes se trouvent au niveau du point d'accueil, à droite en entrant."
    keywords: [toilettes, wc, sanitaires]
  - question: "Où puis-je manger ?"
    answer: "La buvette est ouverte toute la journée à côté du terrain."
    keywords: [manger, boire, buvette, restaurant, faim, soif]
  - question: "À quelle heure commence la finale ?"
    answer: "La finale commence à 15 heures sur le terrain principal."
    keywords: [finale, heure, commence, horaire]
  - question: "Où est l'infirmerie ?"
    answer: "Le poste de secours est signalé près de l'accueil."
    keywords: [infirmerie, secours, médecin, blessé, urgence]
  - question: "Combien de temps dure la compétition ?"
    answer: "La compétition se déroule sur la journée, de 9 heures à 17 heures."
    keywords: [durée, dure, compétition, journée, horaire]
