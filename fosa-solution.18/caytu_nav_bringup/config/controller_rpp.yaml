# Contrôleur par défaut : Regulated Pure Pursuit.
#
# Pourquoi lui plutôt que DWB : nos journaux montraient DWB bloqué pendant près
# d'une minute à osciller sur place (±0.05 rad/s) dès qu'aucune trajectoire
# avant n'était valide. RPP suit simplement le chemin du planificateur, tourne
# sur place quand le cap s'écarte trop, ralentit près des obstacles et s'arrête
# si une collision est imminente ; l'évitement est assuré par la replanification
# (2 Hz) sur des costmaps désormais propres.

controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Vitesses : le plugin DiffDrive officiel accepte 1.5 m/s et 1 rad/s,
      # accélérations 1 m/s² et 2 rad/s².
      desired_linear_vel: 0.5
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 1.6
      # Point visé sur le chemin.
      lookahead_dist: 0.6
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.5
      # Arrivée en douceur sur le centre du but.
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # Sécurité : arrêt si l'arc suivi mène à un obstacle en moins d'une seconde.
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # Ralentissement dans les virages serrés et près des obstacles.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.2
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.4
      cost_scaling_gain: 1.0
      # Doit être égal à cost_scaling_factor de l'inflation locale.
      inflation_cost_scaling_factor: 4.0
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      # Rotation sur place si le chemin part à plus de ~35° du cap courant.
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6
      allow_reversing: false
      stateful: true
