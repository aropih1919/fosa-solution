# slam_toolbox, cartographie manuelle (launch/mapping.launch.py).
# Valeurs de départ pour l'arène réelle (5 m x 5 m, RPLIDAR C1 sous le
# châssis). Les lignes marquées « réglage » sont celles à retoucher en
# rejouant un enregistrement (docs/CARTOGRAPHIE.md, partie 4).
slam_toolbox:
  ros__parameters:
    # Solveur : valeurs par défaut de slam_toolbox.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Repères et capteur.
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    # /scan_clean = lidar sans les secteurs où il voit le robot ni les retours
    # du sol (mêmes filtres que la navigation). Les rayons retirés valent inf
    # ou plus que range_max : slam_toolbox les ignore.
    scan_topic: /scan_clean
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 1.0          # carte rafraîchie chaque seconde (RViz, sauvegarde)
    resolution: 0.05                  # identique aux costmaps de Nav2
    restamp_tf: false
    # Même seuil que la couche lidar de Nav2 : sous 0,35 m, ce sont surtout
    # des morceaux du robot.
    min_laser_range: 0.35
    max_laser_range: 8.0              # réglage : diagonale de l'arène ~7,1 m
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # Un nouveau nœud du graphe tous les 0,5 m ou 0,5 rad (~29°), valeurs de
    # slam_toolbox. Ne pas descendre à 0,1 : les 10 scans gardés en mémoire
    # (scan_buffer_size) ne couvrent alors plus qu'1 m ou 1 rad, et dans le
    # café de Gazebo la carte a sauté de 1 m pendant une rotation sur place
    # (essai du 3 novembre ; 0,5 : écart moyen 3 cm, maximal 11 cm).
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.5      # réglage
    minimum_travel_heading: 0.5       # réglage
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Recherche autour de la pose donnée par l'odométrie.
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Fermeture de boucle.
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Mise en correspondance des scans.
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
