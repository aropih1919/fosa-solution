# Controller FAST — ARCHIVE Jour 2 (Johny).
# Les valeurs rapides (0.55 m/s) sont desormais portees dans
# controller_server_params.yaml. Ce fichier est conserve comme reference
# de test terrain, ne plus l'utiliser comme variante par defaut.
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0  # 15 -> 20 Hz plus réactif
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odom
    enable_stamped_cmd_vel: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15  # 0.30 -> 0.15 : évite faux blocage quand vitesse faible
      movement_time_allowance: 7.0    # 10.0 -> 7.0 : détecte plus vite un vrai blocage, évite attente inutile

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.30
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.55        # 0.40 -> 0.55 m/s  (≈ +37% temps gagné)
      max_vel_y: 0.0
      max_vel_theta: 1.5     # 1.0 -> 1.5 rad/s (rotation plus franche, moins de spirales)
      min_speed_xy: 0.05     # 0.0 -> 0.05 : évite commandes quasi-nulles qui simulent un blocage
      max_speed_xy: 0.55
      min_speed_theta: 0.0
      acc_lim_x: 1.5         # 1.0 -> 1.5  accélération plus vive
      acc_lim_y: 0.0
      acc_lim_theta: 3.0     # 2.0 -> 3.0
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.0
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 24     # 20 -> 24 : meilleure résolution angulaire
      sim_time: 1.4          # 1.7 -> 1.4 : horizon plus court = plus réactif en couloir
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      limit_vel_cmd_in_traj: false
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "PreferForward"]

      ObstacleFootprint:
        scale: 0.02
        sum_scores: false
      PathAlign:
        scale: 32.0
        forward_point_distance: 0.1
      GoalAlign:
        scale: 24.0
        forward_point_distance: 0.1
      PathDist:
        scale: 32.0
      GoalDist:
        scale: 24.0
      PreferForward:
        scale: 8.0           # 3.0 -> 8.0 : pénalise fortement la marche arrière
      RotateToGoal:
        scale: 32.0
        slowing_factor: 5.0
        lookahead_time: -1.0
      Oscillation:
        scale: 1.0
        oscillation_reset_dist: 0.05
        oscillation_reset_angle: 0.2
        oscillation_reset_time: -1.0
        x_only_threshold: 0.05
