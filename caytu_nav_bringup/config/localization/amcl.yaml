amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan_clean
    set_initial_pose: true
    always_reset_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    min_particles: 500
    max_particles: 2000
    laser_min_range: 0.45
    laser_max_range: 11.5
    update_min_d: 0.20
    update_min_a: 0.20
    tf_broadcast: true
    transform_tolerance: 0.5
    save_pose_rate: 0.5
    first_map_only: true
