bt_navigator:
  ros__parameters:

    # SIMULATION
    # Verif Jour 3 (Johny) : BT reste borne avec camera_layer active cote Mpiaro.
    # Aucun retry infini : RecoveryNode 2 essais globaux, 1 planner + 1 controller,
    # RoundRobin Clear/Spin(1.57)/Wait(2s)/BackUp(0.20) — compatible 600 s.

    use_sim_time: true

    # TF

    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    transform_tolerance: 0.3

    # BEHAVIOR TREE

    default_nav_to_pose_bt_xml: "$(find-pkg-share caytu_nav_bringup)/behavior_trees/navigate_bounded_recovery.xml"

    always_reload_bt_xml: false

    # BLACKBOARD

    goal_blackboard_id: goal
    path_blackboard_id: path
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

    # NAVIGATOR

    navigators:
      - navigate_to_pose

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    # BT EXECUTION

    bt_loop_duration: 10
    default_server_timeout: 20
    default_cancel_timeout: 20
