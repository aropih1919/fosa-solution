# Costmap locale : fenetre glissante reactive aux obstacles mobiles.
# Sources : lidar + camera haute + camera basse (une couche par capteur,
# definies dans costmap_common_params.yaml).

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      use_sim_time: true
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      track_unknown_space: false
      always_send_full_costmap: true
      update_frequency: 10.0
      publish_frequency: 5.0

      plugins: ["obstacle_layer", "top_camera_layer", "bottom_camera_layer", "inflation_layer"]

      # Les couches de capteurs sont decrites dans costmap_common_params.yaml.

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        # La fenêtre locale doit pouvoir contourner une foule proche. Le
        # footprint protège la collision réelle ; 0.25 m conserve une marge
        # utile sans faire rejeter les passages étroits à mi-parcours.
        inflation_radius: 0.25
        inflate_unknown: false
        inflate_around_unknown: false
