# Costmap locale : fenetre glissante reactive aux obstacles mobiles.
# Tuning vitesse Jour 2 (Johny, section vitesse uniquement) : resolution 0.075
# (divise le nb de cellules par ~2.2 vs 0.05), fenetre 4 m, inflation 0.30.
# NE PAS toucher aux blocs camera_layer / observation_sources (Mpiaro).

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      use_sim_time: true
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.075
      track_unknown_space: false
      always_send_full_costmap: true
      update_frequency: 15.0
      publish_frequency: 2.0

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        combination_method: 1

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
        inflate_unknown: false
        inflate_around_unknown: false
