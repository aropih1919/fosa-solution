# Costmap locale : fenetre glissante reactive aux obstacles mobiles.

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      use_sim_time: true
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      track_unknown_space: false
      always_send_full_costmap: true
      update_frequency: 10.0
      publish_frequency: 5.0

      # [Mpiaro] camera_layer ajouté avant inflation_layer
      plugins: ["obstacle_layer", "camera_layer", "inflation_layer"]

      obstacle_layer:
        combination_method: 1

      # ---- [Mpiaro] Source d'obstacles CAMERA : identique au global (même topic) ----
      camera_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: camera_points
        camera_points:
          topic: /top_camera/obstacles_points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 3.5
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
          observation_persistence: 0.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        # La fenêtre locale doit pouvoir contourner une foule proche. Le
        # footprint protège la collision réelle ; 0.25 m conserve une marge
        # utile sans faire rejeter les passages étroits à mi-parcours.
        inflation_radius: 0.25
        inflate_unknown: false
        inflate_around_unknown: false