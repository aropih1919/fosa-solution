# Costmap globale : carte statique, lidar, camera haute et inflation.
# Les couches obstacle_layer / top_camera_layer sont definies dans
# costmap_common_params.yaml. La camera basse reste locale (voir ce fichier).

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      use_sim_time: true
      resolution: 0.05
      rolling_window: false
      track_unknown_space: false
      always_send_full_costmap: true
      update_frequency: 5.0
      publish_frequency: 2.0

      plugins: ["static_layer", "obstacle_layer", "top_camera_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      # Les couches de capteurs (obstacle_layer, top_camera_layer) sont
      # entierement decrites dans costmap_common_params.yaml.

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        # Le footprint décrit déjà le robot réel (environ 0.53 x 0.50 m avec
        # padding). Une inflation de 0.30 m garde une distance aux murs sans
        # fermer artificiellement les couloirs de la carte du stade.
        inflation_radius: 0.30
        inflate_unknown: false
        inflate_around_unknown: false
