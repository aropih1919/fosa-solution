# Costmap globale : carte statique, obstacles LiDAR et inflation.

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      use_sim_time: true
      resolution: 0.05
      rolling_window: false
      track_unknown_space: false
      always_send_full_costmap: true
      update_frequency: 5.0
      publish_frequency: 2.0

      plugins: ["static_layer", "obstacle_layer", "camera_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        combination_method: 1

      # Couche camera (contrat OpenCV, memes topic/valeurs que Mpiaro).
      camera_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: camera_points
        camera_points:
          topic: /top_camera/obstacles_points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.0
          obstacle_max_range: 3.5
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
          observation_persistence: 0.0
          expected_update_rate: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
        inflate_unknown: false
        inflate_around_unknown: false
