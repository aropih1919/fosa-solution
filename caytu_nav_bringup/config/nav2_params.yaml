# BT NAVIGATOR

bt_navigator:
  ros__parameters:

    use_sim_time: true

    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom

    transform_tolerance: 0.3

    default_nav_to_pose_bt_xml: "$(find-pkg-share caytu_nav_bringup)/behavior_trees/navigate_bounded_recovery.xml"

    always_reload_bt_xml: false

    navigators:
      - navigate_to_pose

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

      goal_blackboard_id: goal
      path_blackboard_id: path

    bt_loop_duration: 10

    default_server_timeout: 20

    default_cancel_timeout: 20

    # Variables d'erreur utilisées dans le Behavior Tree.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
      - navigate_to_pose_error_code
      - spin_error_code
      - wait_error_code
      - backup_error_code


# BEHAVIOR SERVER

behavior_server:
  ros__parameters:

    use_sim_time: true

    cycle_frequency: 10.0

    global_frame: map
    robot_base_frame: base_footprint

    behavior_plugins:
      - spin
      - backup
      - wait

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    wait:
      plugin: "nav2_behaviors::Wait"

    # Compatible avec le contrôleur CAYTU utilisant Twist.
    enable_stamped_cmd_vel: false


# LIFECYCLE MANAGER

lifecycle_manager_navigation:
  ros__parameters:

    use_sim_time: true

    autostart: true

    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator