# Profil « real_remote » : robot réel, solution exécutée sur le PORTABLE.
# Aucun fichier de l'équipe sur le robot : il fournit ses capteurs et reçoit
# /cmd_vel par le réseau ROS 2 (Wi-Fi). Mêmes interfaces que real.yaml, sauf :
#   - pas de caméras de profondeur : leurs images (~25 Mo/s chacune) ne
#     passent pas par le Wi-Fi. Navigation au lidar seul ;
#   - à utiliser avec une horloge du portable calée sur celle du robot
#     (deploy/check_link.sh). Voir docs/ROBOT_REEL.md, partie 4.
robot: real_remote

# /cmd_vel (Twist) est écouté par le nœud de sécurité obstacle_avoidance des
# organisateurs, qui commande ensuite la base (/botwheel_explorer/cmd_vel).
# Ne jamais publier sur /botwheel_explorer/cmd_vel ni /stamped_vel.
# À VÉRIFIER : point d'entrée officiel à confirmer avec les organisateurs.
cmd_vel_topic: /cmd_vel
odom_topic: /botwheel_explorer/odom
# Pas d'IMU de base : seulement celles des caméras, dans leur repère optique.
# La solution s'en passe (cap de l'odométrie, sol supposé plat).
imu_topic: ''
scan_topic: /scan                   # rplidar_node, repère `laser`

# L'arbre TF réel est odom -> base_link, sans base_footprint. On ajoute
# base_footprint sous base_link, au niveau du sol, pour garder les réglages
# de Nav2, de slam_toolbox et des caméras.
base_footprint:
  publish: true
  parent: base_link
  # Hauteur de base_link au-dessus du sol (m). À VÉRIFIER : hauteur du lidar
  # mesurée au mètre, moins le z de `laser` dans base_link (tf2_echo).
  base_link_height: 0.0

# Les secteurs de la phase 1 (roues vues dans Gazebo) ne valent pas pour le
# vrai robot : seulement les retours très proches (le châssis) sont retirés.
laser_filter_file: laser_filter_params_real.yaml

# Lidar supposé horizontal, sans IMU : aucun rayon n'est attribué au sol.
# Si une ligne de faux obstacles apparaît, forcer floor_line_distance.
floor_filter:
  imu_topic: ''
  default_robot_pitch: 0.0
  lidar_mount_pitch: 0.0

# Pas de caméras à distance : le lidar seul alimente Nav2. Il ne voit pas les
# plateaux de table (il est à quelques centimètres du sol) : garder des
# vitesses basses et l'inflation actuelle autour des pieds de table.
cameras: {}

# Pas de caméras à distance : garde-fou au lidar seul.
collision_cameras: false

record_topics: [/scan, /botwheel_explorer/odom, /camera1/camera1/imu, /camera2/camera2/imu,
                /tf, /tf_static, /robot_description, /joint_states]
record_camera_topics: [/camera1/camera1/color/image_raw, /camera1/camera1/color/camera_info]

# Topics des organisateurs sur lesquels la solution ne doit jamais publier.
reserved_topics: [/scan_filtered, /scan_merged, /camera1/scan, /camera2/scan, /goal,
                  /nav_goal, /botwheel_explorer/cmd_vel, /stamped_vel, /safe_vel, /auto_vel,
                  /status_led, /footprint]
