# Parametres communs aux costmaps global et local (ROS 2 Jazzy / Nav2 1.3.x).
#
# Les costmaps sont des noeuds internes nommes respectivement
# /global_costmap/global_costmap et /local_costmap/local_costmap. Les motifs
# ci-dessous permettent aussi de conserver ces parametres si la pile est
# lancee dans un namespace.
#
# ARCHITECTURE DES SOURCES D'OBSTACLES (une couche par capteur)
#   obstacle_layer       : lidar (/scan_filtered)
#   top_camera_layer     : camera haute  -> /top_camera_scan    (global + local)
#   bottom_camera_layer  : camera basse  -> /bottom_camera_scan (local seulement)
#
# Pourquoi une couche par capteur : dans une meme ObstacleLayer, le raytracing
# (clearing) d'une camera efface les obstacles marques par le lidar (pieds de
# table et de chaise vus par le lidar a ~5 cm, invisibles pour la camera haute).
# Avec des couches separees combinees en maximum (combination_method: 1), une
# couche qui voit "libre" ne peut jamais effacer l'obstacle d'une autre couche.
#
# Les scans cameras sont produits par pointcloud_to_laserscan dans
# solution_bringup.launch.py, dans le frame base_footprint : la hauteur y est
# deja filtree (min_height / max_height). Cote costmap, les points d'un
# LaserScan ont z = 0, d'ou min_obstacle_height legerement negatif (-0.1) pour
# ne pas les rejeter sur un z = -1e-9 issu d'une TF.

/**/global_costmap:
  ros__parameters:
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    # Mesuré depuis le modèle fourni (parc_robot_description) : après les
    # rotations base_footprint -> base_link et des collisions de top_chassis,
    # l'enveloppe au sol est x=[-0.288, 0.198], y=[-0.222, 0.222] m.
    # Les roues atteignent y=+-0.218 m et le caster x=-0.184 m. Ce polygone
    # ajoute 2 à 3 cm de marge sans transformer le robot en obstacle de 1.3 m.
    footprint: "[ [0.22, 0.25], [0.22, -0.25], [-0.31, -0.25], [-0.31, 0.25] ]"
    footprint_padding: 0.02

    # --- LIDAR ---
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      combination_method: 1
      observation_sources: scan
      scan:
        topic: /scan_filtered
        sensor_frame: lidar_link
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: false
        obstacle_max_range: 10.0
        # Le LiDAR est dans le volume du chassis : ignorer les retours propres
        # au robot jusqu'a son rayon circonscrit (environ 0.35 m).
        obstacle_min_range: 0.35
        raytrace_max_range: 12.0
        raytrace_min_range: 0.0
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
        observation_persistence: 0.0
        # 0.2 s etait trop court avec un facteur temps reel < 1 : la couche
        # passait "not current" au moindre retard et bloquait le controller.
        expected_update_rate: 0.5

    # --- CAMERA HAUTE (horizontale, ~1.01 m) ---
    # Voit les plateaux de table, les personnes et tout obstacle haut que le
    # lidar bas ne voit pas. Presente aussi dans la costmap globale : les tables
    # (statiques) y restent marquees une fois vues, donc le planner les evite.
    top_camera_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      combination_method: 1
      observation_sources: top_cam
      top_cam:
        topic: /top_camera_scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: true
        obstacle_max_range: 3.0
        obstacle_min_range: 0.3
        raytrace_max_range: 3.5
        raytrace_min_range: 0.0
        min_obstacle_height: -0.1
        max_obstacle_height: 2.0
        observation_persistence: 0.0
        expected_update_rate: 0.0

/**/local_costmap:
  ros__parameters:
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    # Même enveloppe physique que la globale : le contrôleur ne doit pas
    # accepter localement un passage rejeté par le planner, ou inversement.
    footprint: "[ [0.22, 0.25], [0.22, -0.25], [-0.31, -0.25], [-0.31, 0.25] ]"
    footprint_padding: 0.02

    # --- LIDAR ---
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      combination_method: 1
      observation_sources: scan
      scan:
        topic: /scan_filtered
        sensor_frame: lidar_link
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: false
        obstacle_max_range: 4.0
        obstacle_min_range: 0.35
        raytrace_max_range: 4.5
        raytrace_min_range: 0.0
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
        observation_persistence: 0.0
        expected_update_rate: 0.5

    # --- CAMERA HAUTE ---
    top_camera_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      combination_method: 1
      observation_sources: top_cam
      top_cam:
        topic: /top_camera_scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: true
        obstacle_max_range: 3.0
        obstacle_min_range: 0.3
        raytrace_max_range: 3.5
        raytrace_min_range: 0.0
        min_obstacle_height: -0.1
        max_obstacle_height: 2.0
        observation_persistence: 0.0
        expected_update_rate: 0.0

    # --- CAMERA BASSE (inclinee de 60 deg vers le sol, ~0.58 m) ---
    # Obstacles proches uniquement. Geometrie : un obstacle vertical a la
    # distance d n'est visible que jusqu'a la hauteur 0.58 - 0.425*d, donc la
    # camera ne detecte rien au-dela de ~1 m. Le sol bruite produit de faux
    # obstacles si min_height du scan est trop bas : voir solution_bringup.
    # Pour la desactiver : retirer "bottom_camera_layer" de `plugins` dans
    # local_costmap_params.yaml (aucune autre modification necessaire).
    bottom_camera_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      combination_method: 1
      observation_sources: bottom_cam
      bottom_cam:
        topic: /bottom_camera_scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: true
        obstacle_max_range: 1.0
        obstacle_min_range: 0.3
        raytrace_max_range: 1.2
        raytrace_min_range: 0.0
        min_obstacle_height: -0.1
        max_obstacle_height: 2.0
        observation_persistence: 0.0
        expected_update_rate: 0.0
