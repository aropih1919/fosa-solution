# Parametres communs aux costmaps global et local (ROS 2 Jazzy / Nav2 1.3.x).
#
# Les costmaps sont des noeuds internes nommes respectivement
# /global_costmap/global_costmap et /local_costmap/local_costmap. Les motifs
# ci-dessous permettent aussi de conserver ces parametres si la pile est
# lancee dans un namespace.
#
# Sources d'obstacles : lidar (/scan_filtered) + deux cameras de profondeur
# converties en LaserScan 2D (/top_camera_scan, /bottom_camera_scan) par
# pointcloud_to_laserscan dans solution_bringup.launch.py.

/**/global_costmap:
  ros__parameters:
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    # Mesuré depuis le modèle fourni (parc_robot_description) : après les
    # rotations base_footprint -> base_link et des collisions de top_chassis,
    # l'enveloppe au sol est x=[-0.288, 0.198], y=[-0.222, 0.222] m.
    # Les roues atteignent y=+-0.218 m et le caster x=-0.184 m. Ce polygone
    # ajoute 2 à 3 cm de marge sans transformer le robot en obstacle de 1.3 m.
    footprint: "[ [0.22, 0.25], [0.22, -0.25], [-0.31, -0.25], [-0.31, 0.25] ]"
    footprint_padding: 0.02

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      # Si des obstacles fantomes persistent dans la costmap globale,
      # remettre temporairement : observation_sources: scan
      observation_sources: scan top_cam bottom_cam
      scan:
        topic: /scan_filtered
        sensor_frame: lidar_link
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: false
        obstacle_max_range: 10.0
        # Le LiDAR est dans le volume du chassis : ignorer les retours propres
        # au robot jusqu'a son rayon circonscrit (environ 0.35 m).
        obstacle_min_range: 0.35
        raytrace_max_range: 12.0
        raytrace_min_range: 0.0
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
        observation_persistence: 0.0
        expected_update_rate: 0.2
      # Camera haute (horizontale, ~1 m) : obstacles a hauteur de robot
      # (plateaux de table, personnes) que le lidar bas ne voit pas.
      # Le scan est deja filtre en hauteur par pointcloud_to_laserscan.
      top_cam:
        topic: /top_camera_scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: true
        obstacle_max_range: 3.0
        obstacle_min_range: 0.3
        raytrace_max_range: 3.5
        raytrace_min_range: 0.0
        observation_persistence: 0.0
        expected_update_rate: 0.0
      # Camera basse (inclinee vers le sol) : obstacles proches.
      bottom_cam:
        topic: /bottom_camera_scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: true
        obstacle_max_range: 1.5
        obstacle_min_range: 0.3
        raytrace_max_range: 2.0
        raytrace_min_range: 0.0
        observation_persistence: 0.0
        expected_update_rate: 0.0
/**/local_costmap:
  ros__parameters:
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    # Même enveloppe physique que la globale : le contrôleur ne doit pas
    # accepter localement un passage rejeté par le planner, ou inversement.
    footprint: "[ [0.22, 0.25], [0.22, -0.25], [-0.31, -0.25], [-0.31, 0.25] ]"
    footprint_padding: 0.02

    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: true
      observation_sources: scan top_cam bottom_cam
      scan:
        topic: /scan_filtered
        sensor_frame: lidar_link
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: false
        obstacle_max_range: 4.0
        obstacle_min_range: 0.35
        raytrace_max_range: 4.5
        raytrace_min_range: 0.0
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
        observation_persistence: 0.0
        expected_update_rate: 0.2
      top_cam:
        topic: /top_camera_scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: true
        obstacle_max_range: 3.0
        obstacle_min_range: 0.3
        raytrace_max_range: 3.5
        raytrace_min_range: 0.0
        observation_persistence: 0.0
        expected_update_rate: 0.0
      bottom_cam:
        topic: /bottom_camera_scan
        data_type: "LaserScan"
        marking: true
        clearing: true
        inf_is_valid: true
        obstacle_max_range: 1.5
        obstacle_min_range: 0.3
        raytrace_max_range: 2.0
        raytrace_min_range: 0.0
        observation_persistence: 0.0
        expected_update_rate: 0.0